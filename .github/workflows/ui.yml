name: UI screenshots
# Starts the real game (no screen: a virtual display with software OpenGL), lets client/UiShots open every one of the
# mod's menus and HUD trackers with real data, and keeps the screenshots and the layout report as an artifact.
# Runs when started by hand, or on a push whose commit message has [ui] in it.
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Run the game and take the pictures
        env: { ISG_UISHOTS: '1', LIBGL_ALWAYS_SOFTWARE: '1', MESA_GL_VERSION_OVERRIDE: '4.5' }
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon 2>&1 | tail -n 400 > run/console_tail.txt || true
          ls run/screenshots || true
          cat run/isg_uishots_report.txt || echo "no report written"
          echo "----- console (last 120 lines)"; tail -n 120 run/console_tail.txt
      - name: Keep the results on the ui-shots branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp run/screenshots/*.png run/isg_uishots_report.txt run/console_tail.txt /tmp/out/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b ui-shots && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "UI screenshots for ${GITHUB_SHA}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: |
            run/screenshots/*.png
            run/isg_uishots_report.txt
            run/console_tail.txt
            run/logs/latest.log
