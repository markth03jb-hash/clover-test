name: UI screenshots
# Starts the real game (no screen: a virtual display with software OpenGL), lets client/UiShots open every one of the
# mod's menus and HUD trackers with real data, and keeps the screenshots and the layout report as an artifact.
# Runs when started by hand, or on a push whose commit message has [ui] in it.
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'build.gradle', 'gradle.properties', '.github/workflows/ui.yml']
permissions:
  contents: write
jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # the pictures are split over four jobs side by side (client/UiShots.shard); "merge" puts them together
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Run the game and take the pictures
        env: { ISG_UISHOTS: '1', ISG_SHARD: '${{ matrix.shard }}/4', LIBGL_ALWAYS_SOFTWARE: '1', MESA_GL_VERSION_OVERRIDE: '4.5' }
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          # what passed last time (and its pictures): skipped this time unless its code changed
          git fetch -q origin ui-shots:prev 2>/dev/null && mkdir -p /tmp/prev && git --work-tree=/tmp/prev checkout prev -- . 2>/dev/null || true
          cp /tmp/prev/isg_ui_cache.txt run/ 2>/dev/null || true
          mkdir -p run/screenshots && cp /tmp/prev/*.png run/screenshots/ 2>/dev/null || true
          xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon 2>&1 | tail -n 400 > run/console_tail.txt || true
          ls run/screenshots || true
          cat run/isg_uishots_report.txt || echo "no report written"
          echo "----- console (last 120 lines)"; tail -n 120 run/console_tail.txt
      - name: Keep this shard's results
        if: always()
        run: |
          mkdir -p out/new out/base && cp run/isg_uishots_report.txt run/isg_ui_cache.txt run/console_tail.txt out/ 2>/dev/null || true
          cp run/logs/latest.log out/ 2>/dev/null || true
          # only the pictures this job took (the rest are last time's, kept once - by the first job - as the base)
          for f in run/screenshots/*.png; do [ -f "$f" ] || continue; b=$(basename "$f"); cmp -s "$f" "/tmp/prev/$b" || cp "$f" out/new/; done
          [ "${{ matrix.shard }}" = "0" ] && cp /tmp/prev/*.png out/base/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.shard }}
          path: out/

  merge:
    needs: shots
    if: always() && needs.shots.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: shards, pattern: 'ui-*' }
      - name: One report from the shards
        run: |
          mkdir -p /tmp/out && touch /tmp/body.txt /tmp/out/isg_ui_cache.txt
          n=0; p=0
          cp shards/ui-0/base/*.png /tmp/out/ 2>/dev/null || true
          for d in shards/ui-*; do
            k=${d##*-}
            cp $d/new/*.png /tmp/out/ 2>/dev/null || true
            cat $d/isg_ui_cache.txt >> /tmp/out/isg_ui_cache.txt 2>/dev/null || true
            cp $d/console_tail.txt /tmp/out/console_tail_$k.txt 2>/dev/null || true
            cp $d/latest.log /tmp/out/latest_$k.log 2>/dev/null || true
            if [ -f $d/isg_uishots_report.txt ]; then
              h=$(head -1 $d/isg_uishots_report.txt)
              n=$((n + $(echo "$h" | sed -E 's/.*: ([0-9]+) steps.*/\1/'))); p=$((p + $(echo "$h" | sed -E 's/.*, ([0-9]+) problem.*/\1/')))
              tail -n +2 $d/isg_uishots_report.txt >> /tmp/body.txt
            else
              echo "shard $k | CRASH: wrote no report (the game crashed or timed out)" >> /tmp/body.txt; p=$((p + 1))
            fi
          done
          cp /tmp/out/console_tail_0.txt /tmp/out/console_tail.txt 2>/dev/null || true
          cp /tmp/out/latest_0.log /tmp/out/latest.log 2>/dev/null || true
          { echo "Iron Spell Grimoire - automatic UI check: $n steps, $p problem(s)"; cat /tmp/body.txt; } > /tmp/out/isg_uishots_report.txt
          head -1 /tmp/out/isg_uishots_report.txt
      - name: Keep the results on the ui-shots branch
        run: |
          cd /tmp/out && git init -q && git checkout -q -b ui-shots && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "UI screenshots for ${GITHUB_SHA}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-shots
