name: Game tests
# Starts the real game (no screen: a virtual display with software OpenGL) and runs server/GameTests: every spell,
# every boss, the boards, a rift, an Elf Raid, saving and loading. The job fails if any test fails.
# Runs on every push to main, when started by hand, or on a push whose commit message has [test] in it.
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Run the game tests
        env: { ISG_GAMETESTS: '1', LIBGL_ALWAYS_SOFTWARE: '1', MESA_GL_VERSION_OVERRIDE: '4.5' }
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon 2>&1 | tail -n 400 > run/console_tail.txt || true
          cat run/isg_gametests_report.txt || echo "no report written"
          echo "----- console (last 120 lines)"; tail -n 120 run/console_tail.txt
          grep -q "^Iron Spell Grimoire - game tests" run/isg_gametests_report.txt && ! grep -qE "^(FAIL|CRASH)" run/isg_gametests_report.txt
      - name: Keep the results on the game-tests branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp run/isg_gametests_report.txt run/console_tail.txt /tmp/out/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b game-tests && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Game tests for ${GITHUB_SHA}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" game-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-tests
          path: |
            run/isg_gametests_report.txt
            run/console_tail.txt
            run/logs/latest.log
