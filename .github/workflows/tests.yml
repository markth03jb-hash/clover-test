name: Game tests
# Starts the real game (no screen: a virtual display with software OpenGL) and runs server/GameTests: every spell,
# every boss, the boards, a rift, an Elf Raid, saving and loading. The tests are split over three jobs that run side by
# side (each takes every third test, -Disg.shard); a last job merges their reports into one and fails if any test failed.
# Runs on every push to main, when started by hand, or on a push whose commit message has [test] in it.
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'build.gradle', 'gradle.properties', '.github/workflows/tests.yml']
permissions:
  contents: write
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Run this shard of the game tests
        env: { ISG_GAMETESTS: '1', ISG_SHARD: '${{ matrix.shard }}/3', LIBGL_ALWAYS_SOFTWARE: '1', MESA_GL_VERSION_OVERRIDE: '4.5' }
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          # what passed last time: skipped this time unless its code changed
          git fetch -q origin game-tests:prev 2>/dev/null && mkdir -p /tmp/prev && git --work-tree=/tmp/prev checkout prev -- . 2>/dev/null || true
          cp /tmp/prev/isg_test_cache.txt run/ 2>/dev/null || true
          xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon 2>&1 | tail -n 400 > run/console_tail.txt || true
          cat run/isg_gametests_report.txt || echo "no report written"
      - name: Keep this shard's results
        if: always()
        run: |
          mkdir -p out && cp run/isg_gametests_report.txt run/isg_test_cache.txt run/console_tail.txt out/ 2>/dev/null || true
          cp run/logs/latest.log out/latest.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/

  merge:
    needs: tests
    if: always() && needs.tests.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: shards }
      - name: One report from the three shards
        run: |
          mkdir -p /tmp/out
          ls shards
          for d in shards/shard-*; do
            n=${d##*-}
            [ -f $d/isg_gametests_report.txt ] && tail -n +2 $d/isg_gametests_report.txt >> /tmp/body.txt || echo "CRASH | shard $n | wrote no report (the game crashed or timed out)" >> /tmp/body.txt
            cat $d/isg_test_cache.txt >> /tmp/out/isg_test_cache.txt 2>/dev/null || true
            cp $d/latest.log /tmp/out/latest_$n.log 2>/dev/null || true
            cp $d/console_tail.txt /tmp/out/console_tail_$n.txt 2>/dev/null || true
          done
          cp /tmp/out/latest_0.log /tmp/out/latest.log 2>/dev/null || true
          ps=$(grep -c "^PASS" /tmp/body.txt); f=$(grep -cE "^(FAIL|CRASH)" /tmp/body.txt); w=$(grep -c "^WARN" /tmp/body.txt)
          { echo "Iron Spell Grimoire - game tests: $ps passed, $f failed, $w warning(s)"; cat /tmp/body.txt; } > /tmp/out/isg_gametests_report.txt
          cat /tmp/out/isg_gametests_report.txt
      - name: Keep the results on the game-tests branch
        run: |
          cd /tmp/out && git init -q && git checkout -q -b game-tests && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Game tests for ${GITHUB_SHA}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" game-tests
      - name: Fail if any test failed
        run: grep -q "^Iron Spell Grimoire - game tests" /tmp/out/isg_gametests_report.txt && ! grep -qE "^(FAIL|CRASH)" /tmp/out/isg_gametests_report.txt
