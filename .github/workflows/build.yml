name: Build jar
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - name: Check rules and assets
        run: python3 tools/check_assets.py
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with: { name: iron_spell_grimoire-jar, path: build/libs/*.jar }
      # Test builds (the smoketest branch): keep the jar on its own branch too, so it can be fetched with plain git
      - name: Keep the test jar on the jar-build branch
        if: github.ref == 'refs/heads/smoketest'
        run: |
          mkdir -p /tmp/jar && cp build/libs/*.jar /tmp/jar/ && cd /tmp/jar
          git init -q && git checkout -q -b jar-build && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "jar for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" jar-build
      # Also publish the jar as the "latest" release, so there is always one stable download link
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "Latest build ($(git rev-parse --short HEAD))" --notes "Built automatically from main." --latest
