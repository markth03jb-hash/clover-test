name: Build jar
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - name: Check rules and assets
        run: python3 tools/check_assets.py
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with: { name: iron_spell_grimoire-jar, path: build/libs/*.jar }
      # Also publish the jar as the "latest" release, so there is always one stable download link
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "Latest build ($(git rev-parse --short HEAD))" --notes "Built automatically from main." --latest
