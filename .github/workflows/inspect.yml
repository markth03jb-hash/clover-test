name: Inspect libs
on:
  push:
    branches: [inspect-geo]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: gradle compileJava
      - name: Extract
        run: |
          mkdir -p out
          G=$(find ~/.gradle -name "geckolib-forge-1.20.1-*.jar" | grep -v sources | head -1); echo "geo: $G" > out/jars.txt
          I=$(find ~/.gradle -name "irons_spellbooks-1.20.1-3.16.3*.jar" | grep -v sources | head -1); echo "iron: $I" >> out/jars.txt
          mkdir g i && (cd g && unzip -q -o "$G") && (cd i && unzip -q -o "$I")
          for c in software/bernie/geckolib/renderer/GeoObjectRenderer software/bernie/geckolib/renderer/GeoRenderer software/bernie/geckolib/core/animatable/GeoAnimatable software/bernie/geckolib/animatable/GeoAnimatable software/bernie/geckolib/core/animation/AnimatableManager\$ControllerRegistrar software/bernie/geckolib/core/animation/AnimationController software/bernie/geckolib/core/animation/RawAnimation software/bernie/geckolib/util/GeckoLibUtil software/bernie/geckolib/model/GeoModel software/bernie/geckolib/core/animation/AnimationState software/bernie/geckolib/core/object/PlayState software/bernie/geckolib/core/animatable/instance/AnimatableInstanceCache software/bernie/geckolib/util/RenderUtils software/bernie/geckolib/animatable/SingletonGeoAnimatable software/bernie/geckolib/model/DefaultedObjectGeoModel software/bernie/geckolib/core/animation/AnimatableManager; do
            n=$(echo $c | tr '/$' '__'); javap -p -cp g "$(echo $c | tr '/' '.')" > "out/$n.txt" 2>&1 || true
          done
          find g -path "*software/bernie/geckolib*" -name "*.class" | sed 's#^g/##' | grep -v '\$' > out/geo_classes.txt
          ls i/assets/irons_spellbooks/player_animation > out/iron_anims.txt 2>&1 || true
          for f in i/assets/irons_spellbooks/player_animation/*.json; do echo "== $f"; python3 -c "import json,sys; d=json.load(open('$f')); a=d.get('animations',{}); print(len(a), list(a)[:200])"; done > out/iron_anim_names.txt 2>&1 || true
          cp i/assets/irons_spellbooks/player_animation/*.json out/ 2>/dev/null || true
      - name: Commit findings
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          rm -rf inspect && mv out inspect && git add inspect && git commit -qm "inspect output [skip ci]" && git push
