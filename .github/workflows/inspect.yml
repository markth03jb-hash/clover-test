name: Inspect libs
on:
  push:
    branches: [inspect-geo]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: gradle compileJava
      - name: Extract
        run: |
          mkdir -p out
          G=$(find ~/.gradle -name "geckolib-forge-1.20.1-*.jar" | grep -v sources | head -1)
          mkdir g && (cd g && unzip -q -o "$G")
          javap -p -c -cp g 'software.bernie.geckolib.loading.object.BakedModelFactory$Builtin' > out/bmf.txt 2>&1 || true
          javap -p -c -cp g software.bernie.geckolib.loading.object.BakedModelFactory > out/bmf_iface.txt 2>&1 || true
          javap -p -c -cp g software.bernie.geckolib.renderer.GeoObjectRenderer > out/gor.txt 2>&1 || true
          javap -p -c -cp g software.bernie.geckolib.cache.object.GeoQuad > out/quad.txt 2>&1 || true
          javap -p -c -cp g software.bernie.geckolib.util.RenderUtils > out/ru.txt 2>&1 || true
      - name: Commit findings
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          rm -rf inspect && mv out inspect && git add inspect && git commit -qm "inspect output [skip ci]" && git push
