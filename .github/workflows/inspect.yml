name: Inspect Iron's Spellbooks
on:
  push:
    branches: [inspect-iron]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: gradle compileJava
      - name: Extract
        run: |
          mkdir -p out
          J=$(find ~/.gradle -name "irons_spellbooks-1.20.1-3.16.3*.jar" | grep -v sources | head -1)
          echo "jar: $J"
          mkdir -p x && cd x && unzip -q -o "$J" && cd ..
          find x -path "*gui*" -name "*.png" | head -100 > out/gui_pngs.txt
          cp -r x/assets/irons_spellbooks/textures/gui out/gui_tex || true
          find x -name "*.class" | grep -i -E "wheel|SpellSelection|ClientInputEvents|KeyMappings|SpellBarOverlay|ClientMagicData" > out/classes.txt
          for c in $(cat out/classes.txt); do n=$(echo $c | sed 's#^x/##; s#\.class$##'); javap -p -c -constants -cp x "$n" > "out/$(basename $n).javap.txt" 2>&1 || true; done
          ls x/assets/irons_spellbooks/player_animation | head -200 > out/anims.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: iron-inspect, path: out }
