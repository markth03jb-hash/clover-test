name: Server boot test
on:
  push:
    branches: [smoketest]
permissions:
  contents: write
jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.1.1 }
      - run: gradle build
      - run: bash ci/boot-test.sh
        timeout-minutes: 20
      - name: Keep the results on the branch
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git add -f ci-out
          git commit -m "boot test results [skip ci]" || true
          git push origin HEAD:smoketest-results --force
